<style>
  /*
   * SPA 首屏占位：gegga（熔融渐变环）。
   *
   * 这段模板会被 Nuxt 原样放进 <body> 里的 <div id="__nuxt-loader">，
   * 位置在 <div id="__nuxt"> 之后、正常文档流中，而且此时项目 CSS 还没执行。
   * 因此：
   * - 容器自己 fixed 铺满视口并居中，否则动画会被推到首屏下方；
   * - 颜色、尺寸全部写死／用本文件的变量，不依赖 tokens.css；
   * - 类名和 SVG id 都带 spa-gegga 前缀，避免与应用里的 id 撞车。
   *
   * 深浅色由 head 里的外观引导脚本写下的 html.dark 决定。
   */
  #__nuxt-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;

    /* 浅色：原稿的品红／橙在白底上过亮，各压深一档 */
    --gegga-a: #db2777;
    --gegga-b: #f59e0b;

    --loader-bg: #eef2f8;
    /* 背景只铺在四角／底部，中心留给圆环 */
    --loader-glow:
      radial-gradient(58% 52% at 4% 2%, rgb(219 39 119 / 0.2), transparent 68%),
      radial-gradient(52% 48% at 98% 8%, rgb(245 158 11 / 0.22), transparent 68%),
      radial-gradient(64% 58% at 50% 112%, rgb(99 102 241 / 0.14), transparent 72%);
    --loader-grid: rgb(15 23 42 / 0.055);
    --loader-vignette: rgb(15 23 42 / 0.06);

    background-color: var(--loader-bg);
    background-image: var(--loader-glow);
  }

  html.dark #__nuxt-loader {
    /* 深色：同色相提亮，靠发光撑起层次 */
    --gegga-a: #ff4d9d;
    --gegga-b: #ffb020;

    --loader-bg: #0b1120;
    --loader-glow:
      radial-gradient(58% 52% at 4% 2%, rgb(255 77 157 / 0.24), transparent 68%),
      radial-gradient(52% 48% at 98% 8%, rgb(255 176 32 / 0.18), transparent 68%),
      radial-gradient(64% 58% at 50% 112%, rgb(99 102 241 / 0.2), transparent 72%),
      radial-gradient(90% 70% at 50% 118%, rgb(255 77 157 / 0.12), transparent);
    --loader-grid: rgb(148 163 184 / 0.07);
    --loader-vignette: rgb(0 0 0 / 0.45);

    background-color: var(--loader-bg);
    background-image: var(--loader-glow);
  }

  /* 细网格：给大面积留白一点纹理，中心淡出，不抢圆环 */
  #__nuxt-loader::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(var(--loader-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--loader-grid) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(76% 66% at 50% 46%, rgb(0 0 0) 6%, transparent 84%);
    pointer-events: none;
  }

  /* 四周压暗，把视线收进圆环；中心保持透明不挡主体 */
  #__nuxt-loader::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    background: radial-gradient(120% 105% at 50% 50%, transparent 58%, var(--loader-vignette));
    pointer-events: none;
  }

  .spa-gegga {
    position: relative;
    z-index: 1;
  }

  .spa-gegga__scene {
    position: relative;
    width: clamp(150px, 34vmin, 230px);
    aspect-ratio: 1;
  }

  .spa-gegga__scene > svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 只承载 filter 定义，不占布局；不能用 display:none，否则 Safari 里 filter 失效 */
  .spa-gegga__defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }

  .spa-gegga__ring,
  .spa-gegga__shadow {
    position: absolute;
    inset: 0;
    overflow: visible;
  }

  /* gooey：模糊 + alpha 对比把相邻笔画“熔”在一起 */
  .spa-gegga__ring {
    filter: url(#spa-gegga-filter);
  }

  /* 阴影副本垫在主体下面，模糊后当作同色发光 */
  .spa-gegga__shadow {
    filter: blur(5px);
    opacity: 0.28;
    transform: translate(3px, 3px);
  }

  .spa-gegga__arc,
  .spa-gegga__dots {
    fill: none;
    stroke: url(#spa-gegga-gradient);
    stroke-width: 23;
    stroke-linecap: round;
  }

  .spa-gegga__arc {
    stroke-dasharray: 180 800;
    animation: spa-gegga-spin 10s linear infinite;
  }

  .spa-gegga__dots {
    stroke-dasharray: 26 54;
    animation: spa-gegga-spin 3s linear infinite;
  }

  .spa-gegga__stop-a {
    stop-color: var(--gegga-a);
  }

  .spa-gegga__stop-b {
    stop-color: var(--gegga-b);
  }

  /* 只给读屏软件的提示文字，不参与视觉 */
  .spa-gegga__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    white-space: nowrap;
    border: 0;
    clip-path: inset(50%);
  }

  @keyframes spa-gegga-spin {
    0% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: -403px;
    }
  }

  /* 减弱动效时不直接停住，否则看起来像卡死；放慢三倍 */
  @media (prefers-reduced-motion: reduce) {
    .spa-gegga__arc {
      animation-duration: 30s;
    }

    .spa-gegga__dots {
      animation-duration: 9s;
    }
  }
</style>
