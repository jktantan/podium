name: Deploy demo to GitHub Pages

# Pages 上只是 podium 的展示站：固定 pages 环境构建，保留 demo 页面，
# 接口由内置 mock 提供，不用于业务项目发布。
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # 版本由 package.json 的 packageManager 字段决定

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo site
        run: pnpm build:github-pages
        env:
          # 项目页默认自动推导成 /<repo>/；绑定自定义域名时在仓库
          # Settings -> Secrets and variables -> Actions -> Variables 里设为 /
          NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL }}
          # 可选：覆盖 .env.pages 里的接口地址
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
          # 构建脚本会写 .nojekyll，默认会排除隐藏文件
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
